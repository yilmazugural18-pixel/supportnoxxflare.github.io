<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Apexmyko yayın</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .banner {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1920px;
      height: auto;
      z-index: 1;
      pointer-events: none;
    }

    .sponsor {
      position: absolute;
      left: 146px;
      top: 859px;
      width: 220px;
      height: auto;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <img src="DENEME.jpg" class="banner">
  <img src="sponsor.gif" class="sponsor">

</body>
</html>
