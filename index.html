<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Noxxflare Overlay</title>

<style>

html, body{
margin:0;
padding:0;
background:transparent;
overflow:hidden;
width:100%;
height:100%;
}

.banner{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
justify-content:center;
align-items:flex-end;
pointer-events:none;
}

.banner img{
width:100%;
max-width:1920px;
height:auto;
}

</style>

</head>

<body>

<div class="banner">
<img src="DENEME.jpg">
</div>

</body>
</html>
