<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Apex Overlay</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
}

/* Banner sabit olarak en altta */
.banner {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.banner img{
  width: 100%;
  height: auto;
}
</style>

</head>

<body>

<div class="banner">
  <img src="DENEME.jpg?v=2">
</div>

</body>
</html>
